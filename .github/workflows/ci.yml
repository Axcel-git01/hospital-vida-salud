name: Integracion Continua - Hospital Vida Salud

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permiso de ejecucion a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas (todos los modulos)
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore
