server:
  port: 8085
spring:
  application:
    name: auditoria-service
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/auditoria_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    listener:
      simple:
        # Si el consumidor falla (p. ej. BD caida): 3 intentos con espera y luego se descarta
        # el mensaje en lugar de reencolarlo en bucle infinito.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info
