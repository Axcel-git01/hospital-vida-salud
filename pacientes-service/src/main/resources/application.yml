server:
  port: 8081
spring:
  application:
    name: pacientes-service
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/pacientes_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info
