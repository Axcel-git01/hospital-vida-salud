server:
  port: 8086
spring:
  application:
    name: atenciones-service
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/atenciones_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      # Orden explicito: primero las tablas y luego los indices unicos parciales (PostgreSQL)
      schema-locations: classpath:schema.sql,classpath:schema-postgresql.sql
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info
