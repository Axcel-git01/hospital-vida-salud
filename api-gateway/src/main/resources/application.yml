server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: pacientes
          uri: lb://pacientes-service
          predicates:
            - Path=/api/pacientes/**
        - id: citas
          uri: lb://citas-service
          predicates:
            - Path=/api/citas/**
        - id: atenciones
          uri: lb://atenciones-service
          predicates:
            - Path=/api/atenciones/**
        - id: laboratorio
          uri: lb://laboratorio-service
          predicates:
            - Path=/api/laboratorio/**
        - id: pagos
          uri: lb://pagos-service
          predicates:
            - Path=/api/pagos/**
        - id: notificaciones
          uri: lb://notificaciones-service
          predicates:
            - Path=/api/notificaciones/**
        - id: auditoria
          uri: lb://auditoria-service
          predicates:
            - Path=/api/auditoria/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info
